# Local SQL Server for development. Start with:  docker compose up -d
# The password is for a throwaway local container only.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: Local_Dev_Pass1
    ports:
      - "1433:1433"
