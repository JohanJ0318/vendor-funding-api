name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test tests/VendorFunding.Tests --no-build --configuration Release --logger "console;verbosity=normal"

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Ci_Test_Pass1
        ports:
          - 1433:1433
    env:
      VENDORFUNDING_TEST_DB: "Server=localhost,1433;Database=VendorFunding;User Id=sa;Password=Ci_Test_Pass1;TrustServerCertificate=True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # sqlcmd ships inside the SQL Server image, so run it there with docker exec.
      - name: Copy SQL scripts into the SQL Server container
        run: docker cp db/. ${{ job.services.sqlserver.id }}:/tmp/db

      - name: Wait for SQL Server
        run: |
          for i in $(seq 1 30); do
            docker exec ${{ job.services.sqlserver.id }} /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P Ci_Test_Pass1 -C -Q "SELECT 1" && exit 0
            sleep 2
          done
          echo "SQL Server did not start" && exit 1

      - name: Create schema, seed data, run reporting queries
        run: |
          for f in 01_schema.sql 02_seed.sql 03_reports.sql; do
            echo "== $f"
            docker exec ${{ job.services.sqlserver.id }} /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P Ci_Test_Pass1 -C -b -i /tmp/db/$f
          done

      - run: dotnet test tests/VendorFunding.IntegrationTests --configuration Release --logger "console;verbosity=normal"
